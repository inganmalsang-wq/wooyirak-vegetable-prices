
name: Wooyirak Price Update

on:
  schedule:
    - cron: '15 2,8 * * *'
  workflow_dispatch:
    inputs:
      backfill_batch:
        description: '이번 실행에서 추가 수집할 과거 일수 (0~31)'
        required: false
        default: '8'

concurrency:
  group: wooyirak-price-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check API
        env:
          MAFRA_API_KEY: ${{ secrets.MAFRA_API_KEY }}
        run: python test_api_connection.py

      - name: Update auction
        env:
          MAFRA_API_KEY: ${{ secrets.MAFRA_API_KEY }}
          BACKFILL_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_batch || '4' }}
        run: python update_prices.py --days 2 --history-days 90 --backfill-batch "$BACKFILL_BATCH"

      - name: Update wholesale
        env:
          MAFRA_API_KEY: ${{ secrets.MAFRA_API_KEY }}
          BACKFILL_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_batch || '4' }}
        run: python update_wholesale.py --days 2 --history-days 90 --backfill-batch "$BACKFILL_BATCH"

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update produce prices" && git push)
